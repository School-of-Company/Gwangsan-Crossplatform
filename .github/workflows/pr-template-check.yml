name: PR Template Check

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [main, develop]

jobs:
  check-template:
    name: Check PR Description Template
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]' && github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout
        if: github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'develop'
        uses: actions/checkout@v4

      - name: Verify develop → main PR title matches app version
        if: github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'develop'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const appJson = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            const appVersion = appJson?.expo?.version;

            const plist = fs.readFileSync('ios/app/Info.plist', 'utf8');
            const plistMatch = plist.match(
              /<key>CFBundleShortVersionString<\/key>\s*<string>([^<]+)<\/string>/
            );
            const plistVersion = plistMatch?.[1];

            if (!appVersion || !plistVersion) {
              core.setFailed(
                'app.json(expo.version) 또는 ios/app/Info.plist(CFBundleShortVersionString) 에서 ' +
                '버전을 읽지 못했습니다.'
              );
              return;
            }

            if (appVersion !== plistVersion) {
              core.setFailed(
                `app.json 버전(${appVersion})과 Info.plist 버전(${plistVersion})이 일치하지 않습니다. ` +
                '두 파일의 버전을 맞춰주세요.'
              );
              return;
            }

            const expectedTitle = `v${appVersion}`;
            const title = context.payload.pull_request.title || '';

            if (title.trim() !== expectedTitle) {
              core.setFailed(
                `develop → main PR 제목은 "${expectedTitle}" 이어야 합니다. (현재: "${title}")`
              );
            }

      - name: Verify PR body follows .github/pull_request_template.md
        if: '!(github.event.pull_request.base.ref == ''main'' && github.event.pull_request.head.ref == ''develop'')'
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const heading = '## 💡 PR 요약';

            if (!body.includes(heading)) {
              core.setFailed(
                `PR 설명에 "${heading}" 섹션이 없습니다.\n` +
                'PR 설명은 .github/pull_request_template.md 를 기반으로 작성해야 합니다 ' +
                '(사람이 직접 작성하든 AI(Claude Code 등)로 생성하든 동일하게 적용됩니다). ' +
                '다른 섹션(작업 내용, 리뷰 시 참고사항)은 필요 없으면 지워도 되지만, PR 요약은 필수입니다.'
              );
              return;
            }

            const match = body.match(/## 💡 PR 요약\s*\n([\s\S]*?)(\n## |$)/);
            const summary = (match?.[1] || '')
              .replace(/^>.*$/gm, '')       // 안내용 블록쿼트 제거
              .replace(/\{변경사항\}/g, '') // 미작성 플레이스홀더 제거
              .replace(/^-\s*$/gm, '')      // 빈 불릿 제거
              .trim();

            if (!summary) {
              core.setFailed(
                `"${heading}" 섹션이 비어 있습니다. 변경 내용을 간략히 작성해주세요.`
              );
            }
