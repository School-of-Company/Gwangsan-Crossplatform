name: Secret Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # gitleaks-action@v2는 조직(Organization) 저장소에 유료 라이선스(GITLEAKS_LICENSE)를
      # 요구해 실패함. 라이선스 제한은 액션 래퍼에만 있고 gitleaks CLI 자체는 무료이므로
      # 바이너리를 직접 받아 실행한다.
      # 버전과 체크섬을 고정해 릴리스 바이너리가 바뀌어도 그대로 실행되지 않게 한다.
      # 올릴 때는 릴리스의 gitleaks_<버전>_checksums.txt에서 linux_x64 값을 함께 바꾼다
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSL -f "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          rm gitleaks.tar.gz gitleaks

      - name: Run Gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose
