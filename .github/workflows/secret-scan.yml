name: Secret Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # gitleaks-action@v2는 조직(Organization) 저장소에 유료 라이선스(GITLEAKS_LICENSE)를
      # 요구해 실패함. 라이선스 제한은 액션 래퍼에만 있고 gitleaks CLI 자체는 무료이므로
      # 바이너리를 직접 받아 실행한다.
      - name: Install Gitleaks
        run: |
          VERSION=$(curl -sSL https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep -m1 '"tag_name"' | sed -E 's/.*"v([^"]+)".*/\1/')
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          rm gitleaks.tar.gz gitleaks

      - name: Run Gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose
