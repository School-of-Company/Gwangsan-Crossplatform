name: Android E2E Tests

# R8(축소·난독화)이 켜진 Release APK를 에뮬레이터에서 Detox로 실행해, 리플렉션을 쓰는 라이브러리 코드가
# 제거되어 실행 중 크래시가 나는지 스토어 배포 전에 확인한다
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  issue_comment:
    types: [created]

jobs:
  test-android:
    name: Android E2E Test (Detox, release)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: android-e2e-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
      cancel-in-progress: true
    if: |
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '/run-e2e') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Get PR ref (comment trigger)
        if: github.event_name == 'issue_comment'
        id: get-pr-ref
        uses: actions/github-script@v9
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('ref', pr.data.head.sha);

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'issue_comment' && steps.get-pr-ref.outputs.ref || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      # 기본 러너의 여유 공간(~14GB)으로는 Gradle 캐시 + 에뮬레이터 이미지가 빠듯하다
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk/2* /opt/ghc /usr/local/.ghcup /usr/share/swift || true
          df -h /

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('patches/**') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prebuild Android project
        env:
          DETOX_ANDROID_E2E: 'true'
        run: npx expo prebuild -p android --no-install --clean

      # 에뮬레이터용 x86_64만 빌드한다. minify·shrinkResources는 스토어 빌드와 같은 설정이 그대로 적용된다
      - name: Build release APK for Detox
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
        working-directory: android
        # prebuild 기본 힙(2GB)으로는 R8이 GC만 반복하다 시간 초과되므로 러너 메모리(16GB)에 맞게 늘린다
        run: |
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g/' gradle.properties
          ./gradlew assembleRelease assembleAndroidTest -DtestBuildType=release \
            -PreactNativeArchitectures=x86_64 --stacktrace 2>&1 | tee /tmp/gradle-build.log
          STATUS=${PIPESTATUS[0]}
          # 빌드가 끝난 Gradle·Kotlin 데몬(합쳐 수 GB)이 남아 있으면 에뮬레이터와 메모리를 다투다 러너가 끊긴다
          ./gradlew --stop
          pkill -f KotlinCompileDaemon || true
          exit $STATUS

      - name: Show build log on failure
        if: failure()
        run: tail -300 /tmp/gradle-build.log 2>/dev/null || echo "No build log found"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # .detoxrc.js의 avdName과 같은 이름으로 만들어, Detox가 이미 떠 있는 에뮬레이터를 그대로 쓰게 한다
      - name: Run Detox E2E tests
        timeout-minutes: 40
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          avd-name: Pixel_7_API_33
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: npm run e2e:test:android:release

      # R8이 지운 클래스·메서드 때문에 생긴 크래시는 Detox에는 "앱이 종료됨"으로만 보이므로 원인을 로그로 남긴다
      - name: Show crash log on failure
        if: failure()
        run: find artifacts -name "*.log" -path "*device*" -exec grep -l "FATAL EXCEPTION\|ClassNotFoundException\|NoSuchMethod\|NoSuchField" {} \; -exec grep -A 30 "FATAL EXCEPTION" {} \; 2>/dev/null || true

      - name: Upload test artifacts to GitHub
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: detox-artifacts-android
          path: artifacts/
          retention-days: 7

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Discord webhook URL not set, skipping"
            exit 0
          fi
          if [ "$JOB_STATUS" == "success" ]; then
            TITLE="✅ Detox Android E2E 성공"; COLOR=3066993
          else
            TITLE="❌ Detox Android E2E 실패"; COLOR=15158332
          fi
          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"$TITLE\",\"color\":$COLOR,\"fields\":[{\"name\":\"워크플로우\",\"value\":\"[보기]($RUN_URL)\"}]}]}"
