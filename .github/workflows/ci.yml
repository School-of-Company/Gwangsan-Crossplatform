name: gwangsan-ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Update npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      # PR에서는 아래 unit-coverage job이 테스트를 돌리므로, main/develop에 직접 push된 경우에만
      # 여기서 실행한다. 예전에는 push 때 단위 테스트가 전혀 돌지 않았다(#741)
      - name: Create env file for tests
        if: github.event_name != 'pull_request'
        run: |
          cat <<'EOF' > .env
          EXPO_PUBLIC_SENTRY_DSN=https://test-placeholder@sentry.io/0
          EXPO_PUBLIC_KAKAO_REST_API_KEY=test-placeholder-kakao-rest-key
          EXPO_PUBLIC_KAKAO_JS_KEY=test-placeholder-kakao-js-key
          EOF

      - name: Unit tests
        if: github.event_name != 'pull_request'
        run: npm test -- --ci

  unit-coverage:
    name: Unit Test Coverage
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Update npm
        run: npm install -g npm@11

      - name: Create env file for tests
        run: |
          cat <<'EOF' > .env
          EXPO_PUBLIC_SENTRY_DSN=https://test-placeholder@sentry.io/0
          EXPO_PUBLIC_KAKAO_REST_API_KEY=test-placeholder-kakao-rest-key
          EXPO_PUBLIC_KAKAO_JS_KEY=test-placeholder-kakao-js-key
          EOF

      - name: Report unit test coverage
        uses: ArtiomTr/jest-coverage-report-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          test-script: npm run test:coverage
          package-manager: npm
          annotations: none

  expo-check:
    name: Expo Configuration Check
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    needs: lint-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Update npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Validate Expo configuration
        run: npx expo install --check

      - name: Show EAS project info
        run: npx eas-cli@latest project:info || true

      - name: Check build configuration
        run: |
          cat eas.json
          cat app.json | grep -A 10 '"extra"'

  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # critical은 0건이라 실패 게이트로 둔다. 남은 high(@expo/cli의 zod 3, metro의 image-size,
      # expo-router의 query-string → decode-uri-component)는 Expo SDK 메이저 업그레이드로만 해소돼 리포트만 남긴다.
      - name: Run npm audit (blocking on critical)
        run: npm audit --omit=dev --audit-level=critical

      - name: Run npm audit (report high, not blocking)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
