name: gwangsan-ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Update npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

  unit-coverage:
    name: Unit Test Coverage
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Update npm
        run: npm install -g npm@11

      - name: Create env file for tests
        run: echo "EXPO_PUBLIC_SENTRY_DSN=https://test-placeholder@sentry.io/0" > .env

      - name: Report unit test coverage
        uses: ArtiomTr/jest-coverage-report-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          test-script: npm run test:coverage
          package-manager: npm
          annotations: none

  expo-check:
    name: Expo Configuration Check
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    needs: lint-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Update npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Validate Expo configuration
        run: npx expo install --check

      - name: Show EAS project info
        run: npx eas-cli@latest project:info || true

      - name: Check build configuration
        run: |
          cat eas.json
          cat app.json | grep -A 10 '"extra"'

  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 기존에 확인된 취약점(21건, critical 1건)이 아직 해소되지 않아 우선 리포트만 남깁니다.
      # 정리가 끝나면 `continue-on-error`를 제거해 실패 게이트로 전환하세요.
      - name: Run npm audit (report only, not yet blocking)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
