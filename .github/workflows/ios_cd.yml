name: iOS CD

on:
  workflow_dispatch:
  push:
    branches: ['main']

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS Build (iOS)
        run: |
          eas build --platform ios --profile production --non-interactive --wait

      - name: EAS Submit (App Store)
        run: |
          eas submit --platform ios --profile production --latest --non-interactive

      - name: Tag release
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          TAG="ios-v${VERSION}-${{ github.run_number }}"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Discord webhook URL not set, skipping"
            exit 0
          fi

          if [ "$JOB_STATUS" == "success" ]; then
            TITLE="✅ iOS 프로덕션 배포 성공"
            COLOR=3066993
          else
            TITLE="❌ iOS 프로덕션 배포 실패"
            COLOR=15158332
          fi

          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"$TITLE\",\"color\":$COLOR,\"fields\":[{\"name\":\"워크플로우\",\"value\":\"[보기]($RUN_URL)\"}]}]}"
